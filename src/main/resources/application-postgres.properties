# Optional production-like profile for a local PostgreSQL installation.
# This profile is intentionally kept separate from the default H2 fast path.
# Use it when a machine has PostgreSQL available and you want to validate parity with a more traditional database.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nostra}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:nostra}
spring.datasource.password=${DB_PASSWORD:nostra}

# PostgreSQL parity is intentionally kept separate from the default H2 fast path.
# Flyway is disabled by default because Boot can create a circular dependency during
# JPA/Flyway bootstrap in a lightweight local parity profile before the migration
# sequence is fully validated against a specific PostgreSQL installation.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.h2.console.enabled=false
